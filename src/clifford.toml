[training]
epochs = 100
batch_size = 32
learning_rate = 0.01
validation_split = 0.2
early_stopping_patience = 10
shuffle = true
verbose = true

[database]
path = "database/clifford.db"
backup_enabled = true
backup_interval = 3600

[model]
save_path = "models"
checkpoint_interval = 10
auto_save = true

[gui]
theme = "light"
window_width = 1200
window_height = 800
auto_refresh = true
refresh_interval = 5
